{
  "name": "Build APK",
  "on": ["push", "workflow_dispatch"],
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "name": "Show project files", "run": "find . -path ./.git -prune -o -type f -print | sort | head -80 && echo '--- settings.gradle.kts ---' && cat settings.gradle.kts" },
        { "uses": "actions/setup-java@v4", "with": { "distribution": "temurin", "java-version": "17" } },
        { "uses": "gradle/actions/setup-gradle@v4", "with": { "gradle-version": "8.9" } },
        { "name": "Build debug APK", "run": "gradle assembleDebug --no-daemon" },
        { "uses": "actions/upload-artifact@v4", "with": { "name": "FieldTracker-apk", "path": "app/build/outputs/apk/debug/app-debug.apk" } }
      ]
    }
  }
}
